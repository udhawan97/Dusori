name: Publish companion to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag to publish (for example v0.4.0)
        required: true
        type: string
      allow_historical_format_drift:
        description: Skip formatting only when backfilling a previously published tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package version match
        shell: bash
        run: |
          package_version=$(node -p "require('./packages/companion/package.json').version")
          test "${RELEASE_TAG}" = "v${package_version}"
      - if: ${{ !inputs.allow_historical_format_drift }}
        run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm smoke:companion
      - run: npm publish ./packages/companion --access public --provenance
