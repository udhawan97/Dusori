name: Publish companion to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag to publish (for example v0.9.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify release tag matches the workflow subject
        shell: bash
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          tagged_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "${checked_out_sha}" = "${tagged_sha}"
          test "${checked_out_sha}" = "${GITHUB_SHA}"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package version match
        shell: bash
        run: |
          package_version=$(node -p "require('./packages/companion/package.json').version")
          test "${RELEASE_TAG}" = "v${package_version}"
      - run: pnpm check
      - run: pnpm smoke:companion
      - run: npm publish ./packages/companion --access public --provenance
