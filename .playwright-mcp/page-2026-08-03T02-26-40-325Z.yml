      - main [ref=f3e121]:
        - heading "v0.10.0 release" [level=1] [ref=f3e124]
        - generic [ref=f3e126]:
          - generic [ref=f3e127]:
            - paragraph [ref=f3e128]: Dusori becomes research-first. You name a topic you want to understand, and the research Dusori does is visible, inspectable, and traceable back to the evidence.
            - generic [ref=f3e129]:
              - heading "Research missions on Today" [level=2] [ref=f3e130]
              - link "Section titled “Research missions on Today”" [ref=f3e131] [cursor=pointer]:
                - /url: "#research-missions-on-today"
            - paragraph [ref=f3e136]:
              - strong [ref=f3e137]: Today
              - text: "now opens with what Dusori has looked for, what it found, and what it has actually read: candidates discovered, sources saved, sources read, quoted passages held, when the topic was last refreshed, and which kinds of source it has nothing from yet. Every number is derived from files in your workspace, so a mission cannot report progress the files do not show."
            - paragraph [ref=f3e138]: If a provider failed on the most recent scan, the mission says so. Incomplete coverage never reads as an empty field.
            - generic [ref=f3e139]:
              - heading "A research trail that survives reload" [level=2] [ref=f3e140]
              - link "Section titled “A research trail that survives reload”" [ref=f3e141] [cursor=pointer]:
                - /url: "#a-research-trail-that-survives-reload"
            - paragraph [ref=f3e146]:
              - text: Every scan is recorded in the topic’s
              - code [ref=f3e147]: research.json
              - text: ": when it ran, the exact text providers received, which angle asked the question, how many results were new, and one line per provider saying whether it found results, completed with nothing, or failed — carrying the failure’s own message."
            - paragraph [ref=f3e148]: A scan in which every provider failed is recorded like any other. Before this release, a failed run left nothing on disk, so an outage became indistinguishable from “nothing found” the moment you reloaded the page.
            - generic [ref=f3e149]:
              - heading "Research angles" [level=2] [ref=f3e150]
              - link "Section titled “Research angles”" [ref=f3e151] [cursor=pointer]:
                - /url: "#research-angles"
            - paragraph [ref=f3e156]: "A topic can now be researched from five prepared questions rather than only through a roadmap objective:"
            - list [ref=f3e157]:
              - listitem [ref=f3e158]: Definition and scope
              - listitem [ref=f3e159]: How it works
              - listitem [ref=f3e160]: Debates and criticism
              - listitem [ref=f3e161]: Practice and tools
              - listitem [ref=f3e162]: Recent developments
            - paragraph [ref=f3e163]:
              - text: Each angle sends the topic’s own name plus that angle’s words. Previously a new topic searched using its scaffold objective — creating “Spaced repetition learning” and scanning sent
              - emphasis [ref=f3e164]: “Spaced repetition learning Establish the terms and boundaries.”
              - text: to providers, which surfaced
              - emphasis [ref=f3e165]: Go (game)
              - text: and
              - emphasis [ref=f3e166]: Glossary of computer science
              - text: while missing the topic’s own article. The same scan now returns
              - emphasis [ref=f3e167]: Spaced repetition
              - text: ","
              - emphasis [ref=f3e168]: Spaced learning
              - text: ","
              - emphasis [ref=f3e169]: Rote learning
              - text: ","
              - emphasis [ref=f3e170]: Flashcard
              - text: ", and"
              - emphasis [ref=f3e171]: Forgetting curve
              - text: .
            - paragraph [ref=f3e172]: A roadmap objective remains selectable for curriculum topics.
            - generic [ref=f3e173]:
              - heading "Reading sources into quoted passages" [level=2] [ref=f3e174]
              - link "Section titled “Reading sources into quoted passages”" [ref=f3e175] [cursor=pointer]:
                - /url: "#reading-sources-into-quoted-passages"
            - paragraph [ref=f3e180]:
              - strong [ref=f3e181]: Read saved sources
              - text: reads the text you already approved and stores up to twelve verbatim excerpts per source, each tagged with the heading it sat under. Nothing is paraphrased and no model takes part — a passage Dusori cannot quote back to you is not stored.
            - paragraph [ref=f3e182]: A source holding only an unfetched reference is reported as such, with the route to its text, instead of being silently skipped.
            - generic [ref=f3e183]:
              - heading "A synthesis that cites everything" [level=2] [ref=f3e184]
              - link "Section titled “A synthesis that cites everything”" [ref=f3e185] [cursor=pointer]:
                - /url: "#a-synthesis-that-cites-everything"
            - paragraph [ref=f3e190]:
              - strong [ref=f3e191]: Build synthesis
              - text: writes
              - code [ref=f3e192]: Synthesis.md
              - text: into the topic. It groups quoted passages by what they are about, names which ideas more than one source supports, marks single-source ideas as thin evidence rather than stating them plainly, builds a timeline once at least three sources carry dates, and lists the questions the evidence itself raises. Lenses with nothing saved are named as a gap in coverage, not as an absence of material.
            - paragraph [ref=f3e193]: Every line is a quotation with a link back to its source file. Rebuilding over a synthesis you have edited writes a proposal for review instead of overwriting your work, exactly like a roadmap conflict.
            - paragraph [ref=f3e194]: With the companion and a configured AI provider, a model may write the overview prose only. It is labeled with its model name; the quotations, citations, and evidence accounting stay deterministic, and an AI failure keeps the deterministic document.
            - generic [ref=f3e195]:
              - heading "A learning page you can keep" [level=2] [ref=f3e196]
              - link "Section titled “A learning page you can keep”" [ref=f3e197] [cursor=pointer]:
                - /url: "#a-learning-page-you-can-keep"
            - paragraph [ref=f3e202]:
              - strong [ref=f3e203]: Create learning page
              - text: writes
              - code [ref=f3e204]: Learning/learn.html
              - text: ": concepts with the passages that support them, an optional timeline, and reveal-style check-yourself prompts that keep no score and store nothing."
            - paragraph [ref=f3e205]: The page inlines its own styles and script and makes no network request of any kind. It works offline, opens in any browser without Dusori, and travels in your ZIP export. A page edited outside Dusori is preserved; the rebuild is written beside it.
            - generic [ref=f3e206]:
              - heading "Also in this release" [level=2] [ref=f3e207]
              - link "Section titled “Also in this release”" [ref=f3e208] [cursor=pointer]:
                - /url: "#also-in-this-release"
            - list [ref=f3e213]:
              - listitem [ref=f3e214]: Saved research sources keep why they were chosen. The ranking reasons, the publisher, the author where a provider reports one, and any publication date are stored on the source record instead of being shown once and discarded.
              - listitem [ref=f3e215]:
                - strong [ref=f3e216]: Today
                - text: ’s lanes stack based on the width they actually have rather than the width of the window. With the inspector open on a 1200px screen, the two lanes were squeezed until each item’s actions overlapped its own text.
            - generic [ref=f3e217]:
              - heading "Limitations" [level=2] [ref=f3e218]
              - link "Section titled “Limitations”" [ref=f3e219] [cursor=pointer]:
                - /url: "#limitations"
            - list [ref=f3e224]:
              - listitem [ref=f3e225]: Reading arbitrary web pages still needs the local companion. Without it, the six browser-reachable providers that return text — Wikipedia, OpenAlex, GitHub, Stack Exchange, Hacker News, and npm — are what can be read.
              - listitem [ref=f3e226]: A mission never refreshes itself. Every scan is something you ask for; Dusori still creates no background work.
              - listitem [ref=f3e227]: The public npm companion remains at v0.4.0. Use the browser app or the v0.10.0 source ZIP.
