[package]
name = "dusori-desktop"
version = "0.12.3"
description = "The local-first Dusori learning studio desktop shell"
authors = ["Dusori contributors"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "dusori_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0.149"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
atomicwrites = "0.4.4"
base64 = "0.22.1"
futures-util = "0.3.32"
hex = "0.4.3"
minisign-verify = "0.2.5"
open = "5.3.2"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
