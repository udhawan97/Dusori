packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=5.0.0 <6.0.0': 5.0.9
  'dompurify@>=3.0.0 <4.0.0': 3.4.13
  'fast-uri@>=3.0.0 <4.0.0': 3.1.5
  'fast-uri@>=4.0.0 <5.0.0': 4.1.2
  'find-my-way@>=9.0.0 <10.0.0': 9.7.0
  'js-yaml@>=4.0.0 <5.0.0': 4.3.1
  'nanoid@>=3.0.0 <4.0.0': 3.3.17
  sharp: 0.35.0

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.65.0'
  - '@typescript-eslint/parser@8.65.0'
  - '@typescript-eslint/project-service@8.65.0'
  - '@typescript-eslint/scope-manager@8.65.0'
  - '@typescript-eslint/tsconfig-utils@8.65.0'
  - '@typescript-eslint/type-utils@8.65.0'
  - '@typescript-eslint/types@8.65.0'
  - '@typescript-eslint/typescript-estree@8.65.0'
  - '@typescript-eslint/utils@8.65.0'
  - '@typescript-eslint/visitor-keys@8.65.0'
  - astro@7.1.3
  - eslint-plugin-svelte@3.22.0
  - svelte@5.56.7
  - typescript-eslint@8.65.0
  - fastify@5.11.3

onlyBuiltDependencies:
  - esbuild
  - sharp
